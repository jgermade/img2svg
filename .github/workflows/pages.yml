name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez; las que se acumulen mientras tanto se descartan.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Sin acción de toolchain a propósito: la versión y los targets salen de
      # `rust-toolchain.toml`, que rustup instala solo al leerlo. Fijarlos aquí
      # además del fichero es la forma segura de que acaben sin coincidir.
      - name: Toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      # En debug, porque release apaga los checks de desbordamiento: un `1 - x`
      # sobre un u8 que se da la vuelta pasa desapercibido en release y aquí no.
      - name: Tests
        run: cargo test

      # Y en release, que es lo que se publica.
      - name: Tests (release)
        run: cargo test --release

      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Compilar a WebAssembly
        run: >
          wasm-pack build --release --target web
          --out-dir docs/pkg --out-name img2svg
          -- --no-default-features --features wasm

      - name: Copiar el logotipo
        run: cp img2svg.svg docs/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
