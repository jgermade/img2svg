name: Build

# Compila y prueba. No publica nada: el despliegue a Pages va en release.yml,
# para que el sitio corresponda siempre a una versión publicada.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Reutilizable desde release.yml. El `ref` es obligatorio ahí: un workflow
  # llamado hace checkout de la rama por defecto, así que sin él construiría el
  # commit anterior al del bump de versión.
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # El commit del bump vuelve a disparar `on: push`; sin esto cada release
    # lanzaría una compilación de más.
    if: >
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'release:')
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      # Sin acción de toolchain a propósito: la versión y los targets salen de
      # `rust-toolchain.toml`, que rustup instala solo al leerlo. Fijarlos aquí
      # además del fichero es la forma segura de que acaben sin coincidir.
      - name: Toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Formato
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Las tres imágenes de `tests/corpus.rs` pesan 9 MB y no están en el
      # repositorio: cuelgan de la release `corpus-v1`. Sin ellas esos tests se
      # saltan solos, que en un log de CI se lee igual que pasar.
      - name: Corpus
        run: scripts/corpus.sh
        env:
          CORPUS_REPO: ${{ github.repository }}

      # En debug, porque release apaga los checks de desbordamiento: un `1 - x`
      # sobre un u8 que se da la vuelta pasa desapercibido en release y aquí no.
      # `REQUIRE_CORPUS` convierte un corpus ausente en un fallo: aquí siempre
      # tiene que estar, y si el paso de arriba dejara de traerlo hay que verlo.
      - name: Tests
        run: cargo test
        env:
          REQUIRE_CORPUS: 1

      # Y en release, que es lo que se publica.
      - name: Tests (release)
        run: cargo test --release
        env:
          REQUIRE_CORPUS: 1

      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Compilar a WebAssembly
        run: >
          wasm-pack build --release --target web
          --out-dir web/pkg --out-name img2svg
          -- --no-default-features --features wasm,photo

      - name: Copiar el logotipo
        run: cp img2svg.svg web/

      # release.yml lo recoge de aquí, para desplegarlo y para adjuntarlo.
      - name: Guardar el paquete web
        uses: actions/upload-artifact@v7
        with:
          name: web
          path: web/
          if-no-files-found: error
          retention-days: 7
