[package]
name = "img2svg"
version = "0.1.7"
edition = "2021"
description = "Convierte imágenes en SVG. Modo pixel art: detecta la rejilla y une los píxeles del mismo color en paths"
repository = "https://github.com/jgermade/img2svg"
license = "MIT"
autoexamples = false

[lib]
name = "img2svg"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "img2svg"
path = "src/cli.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "formats", "illustration"]
# Decodificadores de imagen. La build web no los necesita: decodifica el
# navegador y le pasa el RGBA crudo, lo que ahorra medio mega de wasm.
formats = ["image/png", "image/jpeg", "image/gif", "image/bmp", "image/webp"]
# Imágenes que no están sobre una rejilla: segmentación por clustering y ajuste
# por curvas. Va aparte para que se pueda compilar un wasm de sólo pixel art
# —quien entra a convertir un sprite no tiene por qué descargar el resto—, y se
# declara ahora, con lo poco que hay, porque separarlo después obliga a repartir
# módulos ya escritos.
illustration = []
# Se llamaba `photo` cuando el modo se llamaba así. Sigue valiendo, porque una
# feature de cargo es API pública y quitarla rompe a quien la nombre.
photo = ["illustration"]
wasm = ["dep:wasm-bindgen", "dep:js-sys"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
image = { version = "0.25", default-features = false }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[profile.release]
opt-level = 3

# El binario web se optimiza para tamaño: descargarlo rápido importa más que
# convertir en 20 ms en vez de 30.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
